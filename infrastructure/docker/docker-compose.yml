version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: bookora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bookora_db}
      POSTGRES_USER: ${DB_USER:-bookora_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookora_secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookora_admin} -d ${DB_NAME:-bookora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: bookora_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bookora_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bookora_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend Core API
  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    container_name: bookora_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-bookora_admin}:${DB_PASSWORD:-bookora_secret_password}@postgres:5432/${DB_NAME:-bookora_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bookora_redis_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secure_bookora_jwt_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secure_bookora_refresh_key_2026}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
