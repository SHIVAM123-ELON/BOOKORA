version: '3.8'

services:
  # 1. PostgreSQL 16 High-Availability Database
  postgres:
    image: postgres:16-alpine
    container_name: bookora_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-bookora_prod}
      POSTGRES_USER: ${DB_USER:-bookora_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookora_admin} -d ${DB_NAME:-bookora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookora_internal_net

  # 2. Redis 7 Cluster & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: bookora_prod_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookora_internal_net

  # 3. Production Backend API & Worker Nodes
  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    container_name: bookora_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-bookora_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bookora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      ALLOW_MOCK_PAYMENTS: "false"
    ports:
      - "8080:8080"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bookora_internal_net
      - bookora_public_net

secrets:
  db_password:
    external: true

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  bookora_internal_net:
    internal: true
  bookora_public_net:
